name: Build and Release

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate version tag
        id: version
        shell: pwsh
        run: echo "tag=v1.0.$($env:GITHUB_RUN_NUMBER)" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained exe
        run: dotnet publish ./WindowsToolkit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.0.$env:GITHUB_RUN_NUMBER -o ./publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: ./publish/WindowsToolkit.exe
